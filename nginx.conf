server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SEM cache para index.html — sempre busca versão nova
    location ~* /inst\.belem/index\.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Cache longo para assets com hash (imutáveis)
    location ~* /inst\.belem/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing
    location /inst.belem/ {
        try_files $uri $uri/ /inst.belem/index.html;
    }

    # Rota raiz → redireciona para /inst.belem/
    location = / {
        return 301 /inst.belem/;
    }

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
